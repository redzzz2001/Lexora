```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lexora — Busca por Prefixo</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#080a0f;
    --card:#10131a;
    --card2:#151922;
    --text:#f4f6fb;
    --muted:#7f889b;
    --accent:#9ea8ff;
    --accent2:#d9a7ff;
    --border:rgba(255,255,255,.08);
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% -20%, #242b49 0%, transparent 45%),
        var(--bg);

    color:var(--text);

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    padding:30px 20px;
}

main{
    width:100%;
    max-width:1000px;
    margin:auto;
}

/* LOGO */

header{
    text-align:center;
    padding-top:60px;
    margin-bottom:45px;
}

.logo{
    font-size:clamp(52px,9vw,88px);
    font-weight:850;
    letter-spacing:-6px;
    line-height:.9;

    background:linear-gradient(
        100deg,
        #ffffff 0%,
        #bbc1ff 48%,
        #dfaaff 100%
    );

    -webkit-background-clip:text;
    color:transparent;
}

.subtitle{
    margin-top:18px;
    color:var(--muted);
    font-size:17px;
}

/* SEARCH */

.search-area{
    position:relative;
}

.search-box{
    background:rgba(16,19,26,.85);
    backdrop-filter:blur(22px);

    display:flex;
    gap:8px;

    border:1px solid var(--border);
    border-radius:20px;

    padding:8px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.03);
}

input{
    flex:1;

    min-width:0;

    border:0;
    outline:none;

    background:transparent;
    color:white;

    font-size:22px;

    padding:19px 20px;
}

input::placeholder{
    color:#525a69;
}

button{
    border:0;
    outline:none;

    border-radius:14px;

    padding:0 26px;

    background:white;
    color:#101116;

    font-weight:750;
    font-size:15px;

    cursor:pointer;

    transition:
        transform .15s,
        background .15s;
}

button:hover{
    background:#e6e8ff;
    transform:translateY(-1px);
}

button:active{
    transform:scale(.97);
}

.examples{
    text-align:center;

    color:#697284;

    font-size:14px;

    margin-top:15px;
}

/* STATUS */

.status{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:20px;

    margin-top:38px;
    margin-bottom:15px;

    min-height:26px;
}

.status-left{
    color:#8d96a9;
    font-size:14px;
}

.status-right{
    color:#687184;
    font-size:13px;
}

/* RESULTS */

.results{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(180px,1fr));

    gap:11px;

    padding-bottom:70px;
}

.word{
    position:relative;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:14px;

    padding:17px 18px;

    overflow:hidden;

    cursor:pointer;

    font-size:16px;

    transition:
        transform .15s,
        background .15s,
        border-color .15s;
}

.word:hover{
    transform:translateY(-3px);

    background:var(--card2);

    border-color:rgba(174,182,255,.32);
}

.prefix{
    color:#aab3ff;
    font-weight:800;
}

.empty{
    grid-column:1/-1;

    text-align:center;

    color:#687184;

    padding:70px 20px;

    border-radius:20px;

    border:1px dashed rgba(255,255,255,.08);
}

/* LOADER */

.loader-wrap{
    text-align:center;
    padding:50px;
    color:#8b94a6;
}

.loader{
    margin:0 auto 18px;

    width:30px;
    height:30px;

    border-radius:50%;

    border:3px solid rgba(255,255,255,.1);
    border-top-color:#aab3ff;

    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* TOAST */

.toast{
    position:fixed;

    bottom:25px;
    left:50%;

    transform:translate(-50%,25px);

    opacity:0;

    background:white;
    color:#11131a;

    padding:12px 19px;

    border-radius:100px;

    font-size:14px;
    font-weight:650;

    pointer-events:none;

    transition:.2s;

    box-shadow:0 12px 40px rgba(0,0,0,.3);
}

.toast.show{
    transform:translate(-50%,0);
    opacity:1;
}

/* MOBILE */

@media(max-width:600px){

    body{
        padding:20px 13px;
    }

    header{
        padding-top:35px;
    }

    .logo{
        letter-spacing:-4px;
    }

    .search-box{
        flex-direction:column;
    }

    button{
        height:52px;
    }

    .results{
        grid-template-columns:repeat(2,1fr);
    }

    .status{
        align-items:flex-start;
        flex-direction:column;
        gap:5px;
    }

}

</style>
</head>

<body>

<main>

<header>

    <div class="logo">
        Lexora
    </div>

    <div class="subtitle">
        Descubra palavras pelo começo.
    </div>

</header>


<div class="search-area">

    <div class="search-box">

        <input
            id="search"
            type="text"
            placeholder="Digite pi, car, pro..."
            maxlength="30"
            autocomplete="off"
            spellcheck="false"
        >

        <button id="searchButton">
            Buscar
        </button>

    </div>

    <div class="examples">
        pi → piloto, pimenta, pingo, pirata...
    </div>

</div>


<div class="status">

    <div
        id="statusLeft"
        class="status-left"
    >
        Carregando dicionário...
    </div>

    <div
        id="statusRight"
        class="status-right"
    ></div>

</div>


<div
    id="results"
    class="results"
>

    <div class="loader-wrap">

        <div class="loader"></div>

        Baixando palavras...

    </div>

</div>

</main>


<div
    id="toast"
    class="toast"
>
    Palavra copiada
</div>


<script>

/*
    LEXORA

    A lista usada possui mais de 320 mil palavras
    do português brasileiro.

    Fonte:
    github.com/pythonprobr/palavras
*/


const DICTIONARY_URL =
    "https://raw.githubusercontent.com/pythonprobr/palavras/master/palavras.txt";


const MAX_RESULTS = 300;


let words = [];

let normalizedWords = [];

let loaded = false;



const searchInput =
    document.getElementById("search");

const searchButton =
    document.getElementById("searchButton");

const results =
    document.getElementById("results");

const statusLeft =
    document.getElementById("statusLeft");

const statusRight =
    document.getElementById("statusRight");

const toast =
    document.getElementById("toast");



function normalize(text){

    return text

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .toLowerCase()

        .trim();

}



async function loadDictionary(){

    try{

        const cached =
            localStorage.getItem(
                "lexora_dictionary"
            );


        if(cached){

            words =
                JSON.parse(cached);

            prepareDictionary();

            return;

        }


        const response =
            await fetch(
                DICTIONARY_URL
            );


        if(!response.ok){

            throw new Error(
                "Não foi possível baixar o dicionário."
            );

        }


        const text =
            await response.text();


        words =
            text

            .split(/\r?\n/)

            .map(
                word =>
                    word.trim()
            )

            .filter(Boolean)

            .filter(

                word =>

                    /^[A-Za-zÀ-ÿ-]+$/.test(
                        word
                    )

            );


        /*
            Remove palavras repetidas.
        */

        words = [
            ...new Set(words)
        ];


        /*
            Salva no navegador.

            Alguns navegadores possuem
            limite pequeno no localStorage,
            então se falhar simplesmente
            seguimos sem cache.
        */

        try{

            localStorage.setItem(
                "lexora_dictionary",
                JSON.stringify(words)
            );

        }

        catch(error){

            console.log(
                "Cache indisponível."
            );

        }


        prepareDictionary();

    }

    catch(error){

        console.error(error);


        statusLeft.textContent =
            "Falha ao carregar o dicionário";


        statusRight.textContent =
            "";


        results.innerHTML = `

            <div class="empty">

                Não consegui baixar o
                dicionário.

                <br><br>

                Confira sua internet ou
                abra o site usando um
                servidor local.

            </div>

        `;

    }

}



function prepareDictionary(){

    words.sort(

        (a,b) =>

            a.localeCompare(
                b,
                "pt-BR"
            )

    );


    normalizedWords =
        words.map(normalize);


    loaded = true;


    statusLeft.textContent =
        words.length
        .toLocaleString("pt-BR")
        +
        " palavras carregadas";


    statusRight.textContent =
        "PT-BR";


    results.innerHTML = `

        <div class="empty">

            Digite o começo
            de uma palavra.

        </div>

    `;


    searchInput.focus();


    if(searchInput.value){

        searchWords();

    }

}



function searchWords(){

    if(!loaded){
        return;
    }


    const originalPrefix =
        searchInput.value.trim();


    const prefix =
        normalize(
            originalPrefix
        );


    if(!prefix){

        results.innerHTML = `

            <div class="empty">

                Digite o começo
                de uma palavra.

            </div>

        `;


        statusLeft.textContent =
            words.length
            .toLocaleString("pt-BR")
            +
            " palavras carregadas";


        statusRight.textContent =
            "PT-BR";


        return;

    }



    const matches = [];


    let total = 0;



    for(
        let i = 0;
        i < normalizedWords.length;
        i++
    ){

        if(
            normalizedWords[i]
            .startsWith(prefix)
        ){

            total++;


            if(
                matches.length
                <
                MAX_RESULTS
            ){

                matches.push(
                    words[i]
                );

            }

        }

    }



    renderMatches(
        matches,
        prefix,
        total
    );

}



function renderMatches(
    matches,
    prefix,
    total
){

    statusLeft.textContent =

        total === 1

        ? "1 palavra encontrada"

        :

        total
        .toLocaleString("pt-BR")
        +
        " palavras encontradas";


    statusRight.textContent =

        total > MAX_RESULTS

        ?

        "Mostrando as primeiras "
        +
        MAX_RESULTS

        :

        "";



    if(total === 0){

        results.innerHTML = `

            <div class="empty">

                Nenhuma palavra começa
                com

                <strong>
                    ${escapeHTML(
                        searchInput.value
                    )}
                </strong>.

            </div>

        `;

        return;

    }



    const fragment =
        document.createDocumentFragment();



    matches.forEach(word => {

        const card =
            document.createElement("div");


        card.className =
            "word";


        const normalized =
            normalize(word);


        /*
            Calcula onde termina
            visualmente o prefixo.
        */

        let visiblePrefixLength =
            prefix.length;


        const start =
            word.slice(
                0,
                visiblePrefixLength
            );


        const rest =
            word.slice(
                visiblePrefixLength
            );


        card.innerHTML = `

            <span class="prefix">
                ${escapeHTML(start)}
            </span>

            ${escapeHTML(rest)}

        `;


        card.addEventListener(

            "click",

            () =>
                copyWord(word)

        );


        fragment.appendChild(
            card
        );

    });



    results.innerHTML = "";

    results.appendChild(
        fragment
    );

}



async function copyWord(word){

    try{

        await navigator.clipboard.writeText(
            word
        );


        showToast(
            word + " copiado"
        );

    }

    catch(error){

        showToast(
            word
        );

    }

}



function showToast(text){

    toast.textContent =
        text;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1300
        );

}



function escapeHTML(text){

    const div =
        document.createElement("div");


    div.textContent =
        text;


    return div.innerHTML;

}



/*
    Busca enquanto digita.
*/

let searchTimer;


searchInput.addEventListener(

    "input",

    () => {

        clearTimeout(
            searchTimer
        );


        searchTimer =
            setTimeout(
                searchWords,
                60
            );

    }

);



searchInput.addEventListener(

    "keydown",

    event => {

        if(
            event.key === "Enter"
        ){

            searchWords();

        }

    }

);



searchButton.addEventListener(
    "click",
    searchWords
);



loadDictionary();

</script>

</body>
</html>
